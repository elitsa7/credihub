<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Loan Products')}"></head>

<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="admin-section flex-grow-1">
    <div class="container">
        <h2 class="admin-title">Loan Products</h2>
        <div class="card admin-card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table admin-table">
                        <thead>
                        <tr>
                            <th>Name</th>
                            <th>Min Amount</th>
                            <th>Max Amount</th>
                            <th>Min Period</th>
                            <th>Max Period</th>
                            <th>Active</th>
                            <th>Actions</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="product : ${products}">
                            <td th:text="${product.name}"></td>
                            <td th:text="${product.minAmount}"></td>
                            <td th:text="${product.maxAmount}"></td>
                            <td th:text="${product.minPeriodMonths}"></td>
                            <td th:text="${product.maxPeriodMonths}"></td>

                            <td>
                                <span th:if="${product.active}" class="badge bg-success">Active</span>
                                <span th:unless="${product.active}" class="badge bg-danger">Inactive</span>
                            </td>
                            <td>
                                <div class="admin-actions">
                                    <a th:href="@{/admin/products/{id}/edit(id=${product.id})}"
                                       class="btn btn-primary">Edit</a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
