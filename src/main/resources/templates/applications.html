<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Applications')}"></head>

<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="applications-section">
    <div class="container">
        <h2 class="applications-title">My Applications</h2>

        <div th:if="${#lists.isEmpty(applications)}"
             class="card applications-empty">
            <div class="card-body text-center py-5">
                <h5 class="mb-3">No Applications Found</h5>
                <p class="text-muted mb-4">You haven't submitted any loan applications yet.</p>
                <a th:href="@{/applications/create}" class="btn btn-primary px-5">Apply Now</a>
            </div>
        </div>

        <div th:unless="${applications.isEmpty()}" class="card applications-card">
            <div class="card-body">
                <table>
                       class="table applications-table text-center align-middle">
                    <thead>
                    <tr>
                        <th>Product</th>
                        <th>Amount</th>
                        <th>Period</th>
                        <th>Status</th>
                        <th>Created</th>
                        <th>Details</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="loanApplication : ${applications}">
                        <td th:text="${loanApplication.loanProductName}"></td>
                        <td th:text="${loanApplication.requestedAmount}"></td>
                        <td th:text="${loanApplication.periodMonths}"></td>
                        <td>
                <span class="badge bg-warning"
                      th:if="${loanApplication.status.name() == 'PENDING'}">Pending</span>
                            <span class="badge bg-success"
                                  th:if="${loanApplication.status.name() == 'APPROVED'}">Approved</span>
                            <span class="badge bg-danger"
                                  th:if="${loanApplication.status.name() == 'REJECTED'}">Rejected</span>
                            <span class="badge bg-secondary"
                                  th:if="${loanApplication.status.name() == 'CANCELLED'}">Cancelled</span>
                        </td>
                        <td th:text="${#temporals.format(loanApplication.createdAt, 'dd MMM yyyy HH:mm', T(java.util.Locale).ENGLISH)}"></td>
                        <td class="applications-actions">
                            <a th:href="@{/applications/{id}(id=${loanApplication.id})}"
                               class="btn btn-primary btn-sm">View</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
